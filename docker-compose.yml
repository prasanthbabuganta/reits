version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: reits-postgres
    environment:
      POSTGRES_DB: reitsdb
      POSTGRES_USER: reitsuser
      POSTGRES_PASSWORD: reitspass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - reits-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reitsuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for Market Data
  mongodb:
    image: mongo:7
    container_name: reits-mongodb
    environment:
      MONGO_INITDB_DATABASE: reits_market_data
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - reits-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: reits-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reits-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: reits-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - reits-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: reits-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - reits-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reits-backend
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reitsdb
      SPRING_DATASOURCE_USERNAME: reitsuser
      SPRING_DATASOURCE_PASSWORD: reitspass
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/reits_market_data
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: your-secret-key-change-this-in-production-must-be-at-least-256-bits
    networks:
      - reits-network
    restart: unless-stopped

  # React Admin Panel
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: reits-admin
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080/api/v1
    networks:
      - reits-network
    restart: unless-stopped

networks:
  reits-network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
